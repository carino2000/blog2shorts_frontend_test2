<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숏폼 콘텐츠 입력</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: 단일 컬럼 폼 카드, 아래에 미리보기 전용 결과 패널 */
  :root {
    --bg: #f3f4f2; --surface: #ffffff; --fg: #1d211f; --muted: #626a66;
    --line: #d6dbd8; --accent: #03a94d; --accent-fg: #ffffff;
    --danger: #c0352b; --danger-bg: #fbecea; --disabled: #c9cecb;
    --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #141716; --surface: #1d2120; --fg: #e8ebe9; --muted: #9aa29e;
    --line: #333937; --accent: #2fca72; --accent-fg: #0c1a12;
    --danger: #f08378; --danger-bg: #3a1f1c; --disabled: #3d4341; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #141716; --surface: #1d2120; --fg: #e8ebe9; --muted: #9aa29e;
    --line: #333937; --accent: #2fca72; --accent-fg: #0c1a12;
    --danger: #f08378; --danger-bg: #3a1f1c; --disabled: #3d4341; color-scheme: dark; }

  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 36rem; margin: 0 auto; padding-block: 3rem; display: flex; flex-direction: column; gap: 1.5rem; }
  h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
  .lead { margin: .4rem 0 0; color: var(--muted); font-size: .93rem; }
  form { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
  .tabs { display: flex; gap: .5rem; flex-wrap: wrap; }
  .tab { font: inherit; font-size: .88rem; font-weight: 500; padding: .45rem 1rem; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tab:disabled { cursor: not-allowed; opacity: .6; }
  input[type=url], textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: .93rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .6rem .75rem; }
  textarea { resize: vertical; min-height: 12rem; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { margin: .4rem 0 0; font-size: .85rem; color: var(--danger); }
  .count { margin: .25rem 0 0; text-align: right; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .alert { background: var(--danger-bg); color: var(--danger); border-radius: 8px; padding: .75rem .9rem; font-size: .88rem; }
  .alert p { margin: 0; }
  .alert p + p { margin-top: .25rem; }
  .link { font: inherit; background: none; border: 0; padding: 0; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
  .submit { font: inherit; font-weight: 700; font-size: .93rem; padding: .8rem; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .5rem; }
  .submit:disabled { background: var(--disabled); color: var(--muted); cursor: not-allowed; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
  .dev { display: flex; align-items: center; gap: .5rem; font-size: .78rem; color: var(--muted); }
  .result { border: 1px dashed var(--line); border-radius: 12px; padding: 1rem 1.25rem; }
  .result h2 { margin: 0 0 .25rem; font-size: .95rem; }
  .result p { margin: 0 0 .75rem; color: var(--muted); font-size: .85rem; }
  pre { margin: 0; overflow-x: auto; font-family: var(--mono); font-size: .78rem; line-height: 1.5; background: var(--bg); border-radius: 8px; padding: .75rem; }
</style>
<style>body{margin:0} [hidden]{display:none!important}</style>
</head>
<body>

<main class="wrap">
  <header>
    <h1>숏폼 영상 초안 만들기</h1>
    <p class="lead">네이버 블로그 URL이나 본문을 넣으면 30~60초 숏폼 대본을 만들어 드립니다.</p>
  </header>

  <form id="form" novalidate>
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" id="tab-url" data-tab="url" aria-selected="true">블로그 URL</button>
      <button type="button" class="tab" role="tab" id="tab-text" data-tab="text" aria-selected="false">본문 직접 입력</button>
    </div>

    <div id="pane-url">
      <input type="url" id="url" placeholder="https://blog.naver.com/아이디/글번호" value="https://blog.naver.com/example_blog/223000000000" aria-label="네이버 블로그 URL">
      <p class="hint" id="url-hint" hidden>네이버 블로그 글 주소가 아닙니다. 주소창의 전체 URL을 넣어주세요. (naver.me 단축 링크는 지원하지 않습니다)</p>
    </div>

    <div id="pane-text" hidden>
      <textarea id="text" placeholder="블로그 본문을 붙여넣으세요." aria-label="블로그 본문"></textarea>
      <p class="count" id="count">0자</p>
    </div>

    <div class="alert" id="alert" role="alert" hidden>
      <p id="alert-msg"></p>
      <p id="alert-switch">비공개·삭제된 글일 수 있습니다. <button type="button" class="link" id="to-text">본문 직접 입력으로 전환</button></p>
    </div>

    <button type="submit" class="submit" id="submit"><span class="spin" id="spin" hidden></span><span id="submit-label">대본 생성</span></button>

    <label class="dev"><input type="checkbox" id="mock-fail"> [개발용] 목업 실패 응답</label>
  </form>

  <section class="result" id="result" hidden>
    <h2>목업 응답 (미리보기 전용)</h2>
    <p>Next.js 버전에서는 이 데이터를 sessionStorage에 저장하고 /script로 이동합니다.</p>
    <pre id="result-json"></pre>
  </section>
</main>

<script>
  function parseNaverBlogUrl(input) {
    let url;
    try {
      const raw = input.trim();
      url = new URL(/^https?:\/\//i.test(raw) ? raw : `https://${raw}`);
    } catch { return null; }
    const host = url.hostname.replace(/^www\./, '');
    if (host !== 'blog.naver.com' && host !== 'm.blog.naver.com') return null;
    if (/^\/PostView\.n(aver|hn)$/i.test(url.pathname)) {
      const blogId = url.searchParams.get('blogId'), logNo = url.searchParams.get('logNo');
      return blogId && /^\d+$/.test(logNo ?? '') ? { blogId, logNo } : null;
    }
    const [, blogId, logNo] = url.pathname.split('/');
    return blogId && /^\d+$/.test(logNo ?? '') ? { blogId, logNo } : null;
  }

  function mockGenerate(source, shouldFail) {
    return new Promise((resolve, reject) => setTimeout(() => {
      if (shouldFail) return reject(new Error('본문을 가져오지 못했습니다.'));
      resolve({
        id: `draft-${Date.now()}`,
        source: { ...source, images: [] },
        script: { hook: '(목업) 시선을 끄는 첫 문장', body: '(목업) 블로그 핵심 내용 요약', cta: '(목업) 행동 유도 문장', estimatedSec: 45 },
        scenes: [],
        video: { status: 'idle', url: null, format: 'mp4', width: 1080, height: 1920 },
      });
    }, 1200));
  }

  const $ = (id) => document.getElementById(id);
  const state = { tab: 'url', status: 'idle', error: '' };

  function render() {
    const value = state.tab === 'url' ? $('url').value : $('text').value;
    const isEmpty = value.trim() === '';
    const urlInvalid = state.tab === 'url' && !isEmpty && !parseNaverBlogUrl($('url').value);
    const loading = state.status === 'loading';

    document.querySelectorAll('.tab').forEach((b) => {
      b.setAttribute('aria-selected', String(b.dataset.tab === state.tab));
      b.disabled = loading;
    });
    $('pane-url').hidden = state.tab !== 'url';
    $('pane-text').hidden = state.tab !== 'text';
    $('url').disabled = $('text').disabled = loading;
    $('url-hint').hidden = !urlInvalid;
    $('count').textContent = `${$('text').value.length.toLocaleString()}자`;

    $('alert').hidden = state.status !== 'error';
    $('alert-msg').textContent = state.error;
    $('alert-switch').hidden = state.tab !== 'url';

    $('submit').disabled = isEmpty || urlInvalid || loading;
    $('spin').hidden = !loading;
    $('submit-label').textContent = loading
      ? (state.tab === 'url' ? '본문·이미지 불러오는 중…' : '대본 생성 중…')
      : state.status === 'error' ? '다시 시도' : '대본 생성';
  }

  function setTab(tab) { state.tab = tab; state.status = 'idle'; state.error = ''; render(); }

  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  $('to-text').addEventListener('click', () => setTab('text'));
  $('url').addEventListener('input', render);
  $('text').addEventListener('input', render);

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if ($('submit').disabled) return;
    state.status = 'loading'; state.error = ''; $('result').hidden = true; render();
    const source = state.tab === 'url'
      ? { type: 'url', url: $('url').value.trim(), text: '' }
      : { type: 'text', url: null, text: $('text').value.trim() };
    try {
      const project = await mockGenerate(source, $('mock-fail').checked);
      state.status = 'idle';
      $('result-json').textContent = JSON.stringify(project, null, 2);
      $('result').hidden = false;
    } catch (err) {
      state.status = 'error';
      state.error = err.message || '알 수 없는 오류가 발생했습니다.';
    }
    render();
  });

  render();
</script>
</body>
</html>
